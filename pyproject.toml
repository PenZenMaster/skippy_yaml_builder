# Tool configuration for the QA gate (see CLAUDE.md, "Quality gate").
# black and ruff skip everything in .gitignore (venv/, source/, build/,
# dist/, client_yaml/); mypy does not, so it excludes them explicitly.

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Correctness-focused set: pycodestyle errors (E4/E7/E9), pyflakes (F),
# import sorting (I). Style opinions (E501, SIM, RUF, BLE) are not enforced.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["^venv/", "^source/", "^build/", "^dist/", "^client_yaml/"]
